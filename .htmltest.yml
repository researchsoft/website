# htmltest configuration
# Documentation: https://github.com/wjdp/htmltest

DirectoryPath: "public"
LogLevel: 2  # 0=debug, 1=info, 2=warnings+errors (default), 3=errors only
CheckDoctype: true
CheckExternal: true
CheckFavicon: false  # Site uses PNG favicons in <link rel="icon">, not favicon.ico
CheckImages: true
CheckInternal: true
CheckLinks: true
CheckMailto: true
CheckMeta: true
CheckScripts: true

# External link checking
ExternalTimeout: 30
HTTPHeaders:
  User-Agent: "Mozilla/5.0 (compatible; htmltest/0.17.0; +https://github.com/wjdp/htmltest)"

# Check URLs with their query strings intact. htmltest strips them by default,
# which turns links like pub_summ.jsp?ods_key=... or drive.google.com/open?id=...
# into different (broken) URLs and reports false 404s/400s.
StripQueryString: false

# Caching to speed up repeated runs
CacheExpires: "6h"

# Ignore patterns
IgnoreURLs:
  # Social media sites that block automated requests
  - "linkedin.com"
  - "twitter.com"
  - "x.com"
  # Common patterns that may cause issues
  - "fonts.googleapis.com"
  - "fonts.gstatic.com"
  # Sites that work in browsers but fail under htmltest (bot blocks,
  # TLS handshake quirks, slow responses, content negotiation, transient 5xx)
  - "unsplash.com"           # returns 401 to automated clients
  - "metadocencia.org"       # slow, exceeds ExternalTimeout
  - "blog.esciencecenter.nl" # TLS handshake failure under htmltest
  - "alliancecan.ca"         # 429 rate limiting
  - "w3id.org"               # 406 content negotiation
  - "apan55.apan.net"        # transient 500
  - "ror.org"                # 429 rate limiting
  - "ieeexplore.ieee.org"    # 202 to automated clients
  - "force11.org"            # bot protection: 403 / redirect loop
  - "unesco.org"             # bot protection: connection reset
  - "qualtrics.com"          # 503 to automated clients
  - "join.slack.com"         # slow, exceeds ExternalTimeout
  - "github\\.com/[^/]+/[^/]+/blob/"  # GitHub throttles CI runners (429/503)
  # DOIs are verified separately by check-links.sh against the DOI handle
  # API, which confirms the DOI is registered without loading the
  # publisher's site (publishers are slow and often block bots).
  - "^https?://(dx\\.)?doi\\.org/"

# Note: htmltest has no option to ignore HTTP status codes; add sites that
# block automated requests to IgnoreURLs above instead.

# Ignore internal hash links (anchors) that may not exist yet
IgnoreInternalEmptyHash: true

# Ignore trailing slash warnings for directory-based URLs
# Hugo generates /about which works fine on Netlify even though it serves /about/index.html
IgnoreDirectoryMissingTrailingSlash: true

# Allow missing alt text (warning only)
IgnoreAltMissing: false

# Ignore specific files or patterns
IgnoreDirs:
  - "node_modules"
  - ".git"

# Testing options
TestFilesConcurrently: false
CheckInternalHash: true
